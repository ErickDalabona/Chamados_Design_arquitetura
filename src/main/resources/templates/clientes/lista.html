<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: cabecalho('Clientes')}"></head>
<body>
<nav th:replace="~{layout :: menu}"></nav>
<main>
    <div class="topo">
        <h1>Clientes</h1>
        <a class="botao" th:href="@{/app/clientes/novo}">Novo cliente</a>
    </div>

    <p class="ok" th:if="${mensagem}" th:text="${mensagem}"></p>
    <p class="erro" th:if="${erro}" th:text="${erro}"></p>
    <p th:if="${#lists.isEmpty(clientes)}">Nenhum cliente cadastrado.</p>

    <table th:unless="${#lists.isEmpty(clientes)}">
        <thead>
            <tr><th>ID</th><th>Nome</th><th>E-mail</th><th>Telefone</th><th>Ações</th></tr>
        </thead>
        <tbody>
            <tr th:each="c : ${clientes}">
                <td th:text="${c.id()}"></td>
                <td th:text="${c.nome()}"></td>
                <td th:text="${c.email()}"></td>
                <td th:text="${c.telefone()}"></td>
                <td class="acoes">
                    <a class="botao" th:href="@{/app/clientes/{id}/editar(id=${c.id()})}">Editar</a>
                    <form th:action="@{/app/clientes/{id}/excluir(id=${c.id()})}" method="post"
                          onsubmit="return confirm('Excluir este cliente?')">
                        <button class="perigo" type="submit">Excluir</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</main>
</body>
</html>
